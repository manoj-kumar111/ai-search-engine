<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square (white) -->
  <rect x="4" y="4" width="88" height="88" rx="20" fill="#FFFFFF"/>

  <!-- Main sparkle -->
  <path d="M48 28 
           C50 38, 58 46, 68 48
           C58 50, 50 58, 48 68
           C46 58, 38 50, 28 48
           C38 46, 46 38, 48 28Z"
        fill="none"
        stroke="#000000"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Plus sign -->
  <g stroke="#000000" stroke-width="4" stroke-linecap="round">
    <line x1="68" y1="24" x2="68" y2="36"/>
    <line x1="62" y1="30" x2="74" y2="30"/>
  </g>

  <!-- Small circle -->
